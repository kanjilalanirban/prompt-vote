<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Vote</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1f2430; --muted: #6b7280;
    --line: #e5e7eb; --accent: #4a6fc1; --yes: #1f9d55; --no: #d64545;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); }
  header { max-width: 880px; margin: 0 auto; padding: 32px 20px 8px;
           display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
  h1 { margin: 0; font-size: 1.6rem; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .toolbar { display: flex; gap: 8px; }
  .toolbar .btn, .toolbar button { text-decoration: none; display: inline-block; border: 1px solid var(--line); background: var(--card); color: var(--ink);
                    padding: 8px 14px; border-radius: 8px; font-size: .95rem; cursor: pointer; }
  .toolbar .btn:hover, .toolbar button:hover { border-color: var(--accent); }
  .toolbar #reset { color: var(--no); }
  .toolbar #reset:hover { border-color: var(--no); }
  main { max-width: 880px; margin: 0 auto; padding: 12px 20px 40px; display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .q { display: flex; gap: 14px; }
  .num { color: var(--accent); font-weight: 700; font-size: 1.3rem; min-width: 1.2em; }
  .text { font-style: italic; line-height: 1.5; margin: 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; padding-left: 34px; }
  .vote { border: 1.5px solid; background: transparent; padding: 7px 18px; border-radius: 999px;
          font-weight: 600; cursor: pointer; font-size: .95rem; }
  .vote.yes { color: var(--yes); border-color: var(--yes); }
  .vote.no  { color: var(--no);  border-color: var(--no); }
  .vote.yes.chosen { background: var(--yes); color: #fff; }
  .vote.no.chosen  { background: var(--no);  color: #fff; }
  .vote:disabled:not(.chosen) { opacity: .4; cursor: default; }
  .count { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 2ch; }
  .bar { flex: 1 1 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: flex; }
  .bar span { display: block; height: 100%; transition: width .3s; }
  .bar .y { background: var(--yes); } .bar .n { background: var(--no); }
  .status { color: var(--muted); font-size: .85rem; max-width: 880px; margin: 0 auto; padding: 0 20px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Prompt Vote</h1>
    <p>Vote Yes or No on each prompt. One vote per prompt per browser.</p>
  </div>
  <div class="toolbar">
    <a class="btn" href="answers.html">🔑 Answer key</a>
    <button id="refresh" type="button">↻ Refresh</button>
    <button id="reset" type="button">Reset counts</button>
  </div>
</header>
<p class="status" id="status">Loading…</p>
<main id="list"></main>

<script>
const API = "https://abacus.jasoncameron.dev";
const NS = "promptvote2-1eb34e10c019";
// The 12 counts are packed into 3 counters to stay under the service's rate limit
// (30 requests per 10s per IP; people on the same Wi-Fi share one IP).
// Each counter = round*10^12 + [prompt A yes]*1 + [A no]*10^3 + [prompt B yes]*10^6 + [B no]*10^9.
// Admin keys let this page add votes and reset. Anyone with the page can read them.
const KEYS = {"group1":"4b1206b1-727c-45b3-91b3-178cc0176133","group2":"b05d142d-46d4-4945-b125-872f09d222a7","group3":"7d5a305d-a5fd-47f9-94a4-96045e5e7273"};
const GROUPS = Object.keys(KEYS);
const ROUND = 1e12;

const PROMPTS = [
  "Review the promotion and tell me what to do.",
  "Summarize the sales data for the Toronto and Mississauga stores.",
  "For the regional director, rank the stores by fall gap in $K and percent using only FallSales_2026.xlsx. Return a table with store, gap and gap %. Flag any gap worse than -10% and list missing data.",
  "Write a short message to managers about the sales gap.",
  "Using the four case files, write a recovery plan. Make reasonable assumptions.",
  "Using only the four case files, write a one-page recovery brief for store managers: a summary, 3 to 5 actions with owner and due date, and risks. Keep it under 450 words and write Not stated for missing values."
];

const list = document.getElementById("list");
const statusEl = document.getElementById("status");
const groupValues = {};   // last successfully read value per counter
let busy = false, failStreak = 0, timer = null;

PROMPTS.forEach((text, i) => {
  const n = i + 1;
  const card = document.createElement("section");
  card.className = "card";
  card.innerHTML = `
    <div class="q"><span class="num">${n}</span><p class="text"></p></div>
    <div class="row">
      <button class="vote yes" data-q="${n}" data-a="y" type="button">Yes</button>
      <span class="count" id="c${n}y">–</span>
      <button class="vote no" data-q="${n}" data-a="n" type="button">No</button>
      <span class="count" id="c${n}n">–</span>
      <div class="bar"><span class="y" id="b${n}y" style="width:0"></span><span class="n" id="b${n}n" style="width:0"></span></div>
    </div>`;
  card.querySelector(".text").textContent = text;
  list.appendChild(card);
});

const sleep = ms => new Promise(r => setTimeout(r, ms));

// Fetch JSON, retrying with backoff when rate-limited or the network blips.
async function call(url, opts = {}, tries = 5) {
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { cache: "no-store", ...opts });
      if (r.ok) return await r.json();
      if (r.status !== 429 && r.status < 500) throw new Error("HTTP " + r.status);
    } catch (e) {
      if (i === tries - 1) throw e;
    }
    if (i < tries - 1) await sleep(1000 * 2 ** i + Math.random() * 1000);
  }
  throw new Error("Server busy");
}

function slot(n) {                 // which counter and multiplier hold prompt n's votes
  const group = GROUPS[Math.ceil(n / 2) - 1];
  const base = n % 2 === 1 ? 0 : 2;
  return { group, y: 1000 ** base, n: 1000 ** (base + 1) };
}

function countOf(n, a) {
  const s = slot(n), v = groupValues[s.group];
  if (v === undefined) return null;
  return Math.floor((v % ROUND) / s[a]) % 1000;
}

function currentRound() {
  const vals = GROUPS.map(g => groupValues[g]).filter(v => v !== undefined);
  return vals.length ? Math.max(...vals.map(v => Math.floor(v / ROUND))) : null;
}

function myVotes() {
  return JSON.parse(localStorage.getItem("pv2-votes") || "{}");
}

function syncRound() {
  // A reset bumps the round; clear this browser's votes so people can vote again.
  const r = currentRound();
  if (r === null) return;
  if (String(r) !== localStorage.getItem("pv2-round")) {
    localStorage.setItem("pv2-round", String(r));
    localStorage.removeItem("pv2-votes");
  }
}

function render() {
  const votes = myVotes();
  for (let n = 1; n <= PROMPTS.length; n++) {
    const y = countOf(n, "y"), no = countOf(n, "n");
    const total = (y || 0) + (no || 0);
    document.getElementById(`c${n}y`).textContent = y ?? "–";
    document.getElementById(`c${n}n`).textContent = no ?? "–";
    document.getElementById(`b${n}y`).style.width = total ? (y / total * 100) + "%" : "0";
    document.getElementById(`b${n}n`).style.width = total ? (no / total * 100) + "%" : "0";
    document.querySelectorAll(`.vote[data-q="${n}"]`).forEach(b => {
      b.disabled = !!votes[n];
      b.classList.toggle("chosen", votes[n] === b.dataset.a);
    });
  }
}

async function refresh() {
  if (busy) return;
  busy = true;
  statusEl.textContent = "Refreshing…";
  try {
    const vals = await Promise.all(GROUPS.map(g => call(`${API}/get/${NS}/${g}`, {}, 3)));
    GROUPS.forEach((g, i) => groupValues[g] = vals[i].value);
    syncRound();
    render();
    failStreak = 0;
    statusEl.textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) {
    // Keep showing the last good counts; never replace them with zeros.
    failStreak++;
    statusEl.textContent = "Server busy — showing last counts, retrying shortly.";
  } finally {
    busy = false;
  }
}

function schedule() {
  clearTimeout(timer);
  // 20–30s, longer after failures; random spread so viewers don't all refresh at once.
  const wait = (20000 + Math.random() * 10000) * Math.min(2 ** failStreak, 6);
  timer = setTimeout(async () => {
    if (!document.hidden) await refresh();
    schedule();
  }, wait);
}

list.addEventListener("click", async e => {
  const b = e.target.closest(".vote");
  if (!b || b.disabled) return;
  const n = b.dataset.q, a = b.dataset.a, s = slot(+n);
  const votes = myVotes();
  votes[n] = a;
  localStorage.setItem("pv2-votes", JSON.stringify(votes));
  render();
  statusEl.textContent = "Saving vote…";
  try {
    const r = await call(`${API}/update/${NS}/${s.group}?value=${s[a]}`,
      { method: "POST", headers: { Authorization: `Bearer ${KEYS[s.group]}` } }, 6);
    groupValues[s.group] = r.value;
    render();
    statusEl.textContent = "Vote saved.";
  } catch (err) {
    delete votes[n];
    localStorage.setItem("pv2-votes", JSON.stringify(votes));
    render();
    statusEl.textContent = "Server busy — vote not saved. Please try again in a few seconds.";
  }
});

document.getElementById("refresh").addEventListener("click", refresh);

document.getElementById("reset").addEventListener("click", async () => {
  if (!confirm("Reset all vote counts to zero for everyone?")) return;
  statusEl.textContent = "Resetting…";
  try {
    const vals = await Promise.all(GROUPS.map(g => call(`${API}/get/${NS}/${g}`)));
    const next = Math.max(...vals.map(v => Math.floor(v.value / ROUND))) + 1;
    await Promise.all(GROUPS.map(g => call(`${API}/set/${NS}/${g}?value=${next * ROUND}`,
      { method: "POST", headers: { Authorization: `Bearer ${KEYS[g]}` } })));
    GROUPS.forEach(g => groupValues[g] = next * ROUND);
    syncRound();
    render();
    statusEl.textContent = "Counts reset at " + new Date().toLocaleTimeString();
  } catch (e) {
    statusEl.textContent = "Reset didn't finish (server busy). Please press Reset again.";
  }
});

document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

refresh();
schedule();
</script>
</body>
</html>
