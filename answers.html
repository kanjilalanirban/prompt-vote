<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>G-SCOPE Answers</title>
<style>
  :root { --navy:#0b1f45; --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb;
          --weak:#b0413a; --strong:#3f7a3a; --okbg:#dcebd9; --okfg:#2f6b2b; --xbg:#f3d6d6; --xfg:#b0413a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#fff; }
  main { max-width:1200px; margin:0 auto; padding:32px 20px 48px; }
  h1 { margin:0 0 6px; font-size:1.5rem; }
  .lock { max-width:360px; margin:12vh auto 0; text-align:center; }
  .lock p { color:var(--muted); margin:6px 0 18px; }
  .lock form { display:flex; gap:8px; }
  .lock input { flex:1; padding:10px 12px; font-size:1rem; border:1px solid var(--line); border-radius:8px; }
  .lock button { padding:10px 18px; font-size:1rem; border:0; border-radius:8px; background:var(--navy); color:#fff; cursor:pointer; }
  .err { color:var(--weak); min-height:1.4em; margin-top:10px; font-size:.9rem; }
  .intro { margin:0 0 16px; font-size:1.05rem; }
  .intro .g { color:var(--okfg); font-weight:600; } .intro .r { color:var(--xfg); font-weight:600; }
  .wrap { overflow-x:auto; }
  table { width:100%; border-collapse:separate; border-spacing:2px; min-width:900px; }
  th { background:var(--navy); color:#fff; text-align:left; padding:14px 10px; font-size:1rem; }
  td { padding:14px 10px; vertical-align:middle; line-height:1.45; border-bottom:1px solid var(--line); }
  .n { color:#4a6fc1; text-align:center; width:44px; font-weight:600; }
  th.n { color:#fff; }
  th.c { text-align:center; width:64px; }
  .v { width:120px; text-align:center; color:#fff; font-weight:700; letter-spacing:.03em; border:0; }
  .weak { background:var(--weak); } .strong { background:var(--strong); }
  .ok, .x { text-align:center; font-size:1.4rem; font-weight:700; border:0; }
  .ok { background:var(--okbg); color:var(--okfg); }
  .x { background:var(--xbg); color:var(--xfg); }
</style>
</head>
<body>
<main>
  <section class="lock" id="lock">
    <h1>G-SCOPE Answers</h1>
    <p>Enter the key to see the answers.</p>
    <form id="form">
      <input id="key" type="password" placeholder="Key" autocomplete="off" autofocus aria-label="Key">
      <button type="submit">Show</button>
    </form>
    <div class="err" id="err" role="alert"></div>
  </section>
  <section id="answers" hidden></section>
</main>

const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:bytes(DATA.salt), iterations:200000, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:bytes(DATA.iv) }, key, bytes(DATA.ct));
  return new TextDecoder().decode(plain);
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "Checking…";
  try {
    const html = await unlock(document.getElementById("key").value.trim());
    const out = document.getElementById("answers");
    out.innerHTML = html;
    out.hidden = false;
    document.getElementById("lock").hidden = true;
  } catch {
    err.textContent = "Wrong key. Try again.";
  }
});
